apply plugin: "com.android.application"
apply plugin: "com.chaquo.python"

android {
    namespace "ai.panxian.arkbox"
    compileSdk 35

    defaultConfig {
        applicationId "ai.panxian.arkbox"
        minSdk 24
        // 28 是刻意的：Android 10+（W^X）禁止 App 执行私有目录里的二进制，
        // 而嵌入式 Termux 运行时必须 exec proot/bash。Termux 官方也钉在 28。
        targetSdk 28
        versionCode 11
        versionName "0.1.10"

        ndk {
            // 手机几乎都是 arm64；x86_64 留给模拟器。
            // 不列 armeabi-v7a：Chaquopy 的 Python 3.13 没提供 32 位 ARM 构建。
            abiFilters "arm64-v8a", "x86_64"
        }

        python {
            // Chaquopy 需要本机 CPython 跑构建期 pip，并据此对齐目标版本
            buildPython(System.getenv("ARKDROID_BUILD_PYTHON") ?: "python")
            // arkbridge 用了 tomllib（3.11+），必须显式指定，否则 Chaquopy 默认给 3.8
            version "3.13"
            pyc {
                src = false
            }
            // 生产代码零第三方依赖：内置的 arkbridge 只用标准库
            pip {}
        }
    }

    signingConfigs {
        // 覆盖升级的前提是「同一个签名」。CI 的 debug keystore 每次构建都是新生成的，
        // 用它签出来的包互相覆盖不了（INSTALL_FAILED_UPDATE_INCOMPATIBLE）。
        // 所以 CI 从仓库 secrets 里还原一个固定的 PKCS12 签名库，debug/release 都用它。
        if (System.getenv("ARKDROID_KEYSTORE")) {
            create("env") {
                storeFile file(System.getenv("ARKDROID_KEYSTORE"))
                storeType System.getenv("ARKDROID_STORE_TYPE") ?: "PKCS12"
                storePassword System.getenv("ARKDROID_STORE_PASSWORD") ?: ""
                keyAlias System.getenv("ARKDROID_KEY_ALIAS") ?: ""
                keyPassword System.getenv("ARKDROID_KEY_PASSWORD") ?: ""
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            // debug 也用固定签名：本地/CI 产出的包都能互相覆盖，旧包也能直接升级
            if (System.getenv("ARKDROID_KEYSTORE")) {
                signingConfig signingConfigs.getByName("env")
            }
        }
        release {
            minifyEnabled false
            if (System.getenv("ARKDROID_KEYSTORE")) {
                signingConfig signingConfigs.getByName("env")
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
}

// 组件清单只有一份（dist/manifest.json），构建时同步进 assets，避免两处漂移
def syncManifest = tasks.register("syncManifest", Copy) {
    from rootProject.file("dist/manifest.json")
    into layout.projectDirectory.dir("src/main/assets")
}

// ArkBox 的 Termux 侧脚本直接放在 assets/termux/（不再从根目录同步）。
// 这里只做一件有价值的事：把行尾压成 LF——这些脚本会被推到手机里的
// Termux 执行，CRLF 会让 bash 报 "bad interpreter ... bash^M"。
def syncTermux = tasks.register("syncTermux") {
    def dst = layout.projectDirectory.dir("src/main/assets/termux")
    inputs.dir(dst)
    outputs.dir(dst)
    doLast {
        dst.asFile.listFiles()?.each { f ->
            if (f.isFile()) {
                def text = f.getText("UTF-8").replace("\r\n", "\n")
                f.setText(text, "UTF-8")
            }
        }
    }
}

syncTermux.configure {
    // syncTermux 对 assets/termux 做行尾归一化，而 syncManifest 会往同一个 assets
    // 目录写 manifest.json——Gradle 要求显式声明先后关系，否则校验报 implicit dependency
    mustRunAfter(syncManifest)
}

tasks.configureEach { task ->
    if (task.name == "preBuild") {
        task.dependsOn(syncManifest, syncTermux)
    }
}
